version: v1
plugins:
  - plugin: go
    out: ../../packages/go-sdk/internal/gen/envd
    opt:
      - paths=source_relative
  - plugin: connect-go
    out: ../../packages/go-sdk/internal/gen/envd
    opt:
      - paths=source_relative

managed:
  enabled: true
  optimize_for: SPEED
  go_package_prefix:
    default: github.com/abox-dev/sdk/packages/go-sdk/internal/gen/envd
