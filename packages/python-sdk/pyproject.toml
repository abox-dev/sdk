[project]
name = "abox-sdk"
version = "0.1.1"
description = "AgentBox SDK for secure cloud sandboxes"
authors = [{ name = "RetailDriver LLC" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.8.2",
    "wcmatch>=10.1,<12",
    "protobuf-py>=0.1.1,<0.2",
    "httpx>=0.27.0,<1.0.0",
    "h2>=4.4.1,<5",
    "attrs>=23.2.0",
    "packaging>=24.1",
    # 4.10 is the first release whose TypedDict accepts PEP 728's `closed`,
    # which the generated agentbox/sandbox/mcp.py passes at class-creation time.
    "typing-extensions>=4.10.0",
    "dockerfile-parse>=2.0.1,<3",
    "rich>=14.0.0",
    "connectrpc>=0.11.1,<0.12",
    "pyqwest>=0.10.0,<0.11",
]

[project.urls]
Homepage = "https://docs.agentbox.ru/en/sdk/"
Documentation = "https://docs.agentbox.ru/en/sdk-reference/python/"
Repository = "https://github.com/abox-dev/sdk/tree/main/packages/python-sdk"
"Bug Tracker" = "https://github.com/abox-dev/sdk/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.3.1,<4",
    "python-dotenv>=1.0.0,<2",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.11.12,<0.12",
    "pytest-timeout>=2.4.0,<3",
    "ty>=0.0.15,<0.0.16",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agentbox"]
module-root = ""

[tool.basedpyright]
reportInconsistentOverload = false

[tool.ty.rules]
invalid-overload = "ignore"
no-matching-overload = "ignore"

[tool.ruff.lint.per-file-ignores]
"agentbox/__init__.py" = ["F401"]

[[tool.ty.overrides]]
include = ["agentbox/api/client/models/**"]
rules = { invalid-argument-type = "ignore" }
