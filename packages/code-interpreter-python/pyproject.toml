[project]
name = "abox-code-interpreter"
version = "0.1.1"
description = "AgentBox Code Interpreter - Stateful code execution"
authors = [{ name = "RetailDriver LLC" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.20.0,<1.0.0",
    "attrs>=21.3.0",
    "abox-sdk>=0.1.0,<0.2.0",
]

[project.urls]
Homepage = "https://docs.agentbox.ru/en/sdk/code-interpreter/"
Documentation = "https://docs.agentbox.ru/en/sdk-reference/python/code-interpreter/"
Repository = "https://github.com/abox-dev/sdk/tree/main/packages/code-interpreter-python"
"Bug Tracker" = "https://github.com/abox-dev/sdk/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "python-dotenv>=1.0.0,<2",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-xdist>=3.6.1,<4",
    "matplotlib>=3.8.0,<4",
    "ruff>=0.11.12,<0.12",
    "ty>=0.0.15,<0.0.16",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agentbox_code_interpreter"]
module-root = ""

[tool.uv.sources]
abox-sdk = { workspace = true }

[tool.uv.workspace]
members = ["../python-sdk"]

[tool.ruff.lint]
ignore = ["F401", "F403"]
